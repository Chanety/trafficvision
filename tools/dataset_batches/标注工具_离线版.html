<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>交通目标标注复核（离线版）</title>
<style>
  :root { --bg:#22262a; --panel:#2e3338; --line:#454b52; --fg:#e8e8e8; --dim:#9aa2aa; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:14px/1.5 "Microsoft YaHei","Segoe UI",sans-serif; overflow:hidden; }
  #bar { display:flex; align-items:center; gap:10px; padding:8px 12px;
         background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  button { background:#3b4147; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { background:#474e55; }
  button.primary { background:#2f6f4f; border-color:#3d8a63; }
  button.primary:hover { background:#38835e; }
  #stat { color:var(--dim); margin-left:auto; white-space:nowrap; }
  #stage { position:relative; width:100%; height:calc(100% - 49px); }
  canvas { display:block; width:100%; height:100%; cursor:crosshair; }
  #cls { position:absolute; left:12px; bottom:12px; display:flex; gap:6px; flex-wrap:wrap; }
  .chip { padding:4px 10px; border-radius:999px; border:2px solid transparent;
          background:#33383d; cursor:pointer; font-size:13px; user-select:none; }
  .chip.on { border-color:#fff; font-weight:600; }
  #help { position:absolute; right:12px; bottom:12px; max-width:46ch; background:#2b3035ee;
          border:1px solid var(--line); border-radius:8px; padding:10px 14px; color:var(--dim);
          font-size:12.5px; display:none; }
  #toast { position:absolute; left:50%; top:16px; transform:translateX(-50%);
           background:#2f6f4fe6; padding:8px 18px; border-radius:8px; display:none; }
</style>
</head>
<body>
<div id="bar">
  <button id="open" class="primary">① 选择批次文件夹</button>
  <button id="prev">上一张 (A / ←)</button>
  <button id="next">下一张 (D / →)</button>
  <button id="fit">适应窗口 (F)</button>
  <button id="rule">清骑车人 (R)</button>
  <button id="undo">撤销 (Ctrl+Z)</button>
  <button id="save">保存本张 (Ctrl+S)</button>
  <button id="export">导出全部改动</button>
  <button id="helpBtn">快捷键</button>
  <span id="stat">没有加载数据</span>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="cls"></div>
  <div id="help">
    <b>操作</b><br>
    滚轮 = 缩放（以光标为中心）；中键拖动 或 空格+左键拖动 = 平移<br>
    空白处左键拖动 = 画新框；点框 = 选中；拖动选中框 = 移动；拖四角 = 改大小<br>
    数字键 1~9 = 改选中框（或新框）的类别；Delete / Backspace = 删除选中框<br>
    A / ← = 上一张，D / → = 下一张（自动保存）；F = 适应窗口；R = 清理骑乘中的行人框<br>
    Ctrl+Z = 撤销；Ctrl+S = 保存本张<br>
    <br>
    <b>规则</b>：先载具后行人（骑车人只标载具）；拿不准的框留着别删；
    标志牌 / 路桩是静止类必须保留。
  </div>
  <div id="toast"></div>
</div>
<script>
"use strict";
/* 类别表：优先从所选文件夹的 classes.txt 读取（见 setClasses），
   读不到才退回下面这套内置的 9 类。
   为什么必须这样：工具原来写死 9 类，而批次数据已升到 10 类（含 rider），
   协作者会看不到第 10 类、也按不出对应的数字键。 */
let CLASSES = ["car","truck","bus","motorcycle","bicycle","person","sign","bollard","tricycle"];
const CLASS_CN_MAP = {
  car:"汽车", truck:"卡车", bus:"公交", motorcycle:"摩托", bicycle:"自行车",
  person:"行人", sign:"标志牌", bollard:"路桩", tricycle:"三轮车",
  nonmotor:"非机动车", roadlamp:"路灯", trafficlight:"信号灯", rider:"非机动车驾驶员",
};
let CLASS_CN = CLASSES.map(c => CLASS_CN_MAP[c] || c);
const COLOR_POOL = ["#4caf50","#0099ff","#ff8c1a","#ffd24d","#d9a3ff","#ff5d5d",
                    "#ffffff","#9aa2ff","#00d7ff","#ff9f43","#7ed6df"];
let COLORS = CLASSES.map((_, i) => COLOR_POOL[i % COLOR_POOL.length]);
// 载具 / 行人的编号按类别名动态取，避免换口径后"清骑车人"失效
function vehicleIds() {
  return ["car","truck","bus","motorcycle","bicycle","tricycle","nonmotor"]
    .map(n => CLASSES.indexOf(n)).filter(i => i >= 0);
}
function personId() { return CLASSES.indexOf("person"); }

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
const statEl = document.getElementById("stat");
const clsEl = document.getElementById("cls");
const helpEl = document.getElementById("help");
const toastEl = document.getElementById("toast");

let items = [];        // {name, file, url, img, w, h, boxes, base, dirty, handle}
let dirHandle = null;  // 支持写回时才有
let idx = 0, scale = 1, ox = 0, oy = 0;
let sel = -1, curCls = 0, mode = null, drag = null;
let undo = [];         // 每张图一条撤销栈
let spaceDown = false;

function toast(msg, ms = 1800) {
  toastEl.textContent = msg;
  toastEl.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { toastEl.style.display = "none"; }, ms);
}

/* ---------------- 类别按钮 ---------------- */
function buildChips() {
  clsEl.innerHTML = "";
  CLASSES.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "chip";
    d.dataset.i = i;
    d.style.color = COLORS[i % COLORS.length];
    d.textContent = (i + 1) + " " + CLASS_CN[i];
    d.onclick = () => setClass(i);
    clsEl.appendChild(d);
  });
}

/* 用数据集自带的 classes.txt 覆盖类别表，并重建按钮 */
function setClasses(names) {
  if (!names || !names.length) return;
  CLASSES = names.slice();
  CLASS_CN = CLASSES.map(c => CLASS_CN_MAP[c] || c);
  COLORS = CLASSES.map((_, i) => COLOR_POOL[i % COLOR_POOL.length]);
  buildChips();
  curCls = Math.min(curCls, CLASSES.length - 1);
  refreshChips();
  toast(`已按 classes.txt 载入 ${CLASSES.length} 个类别`, 2500);
}
function parseClassesText(text) {
  return String(text || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
}
buildChips();
function refreshChips() {
  [...clsEl.children].forEach((el, i) => el.classList.toggle("on", i === curCls));
  statEl.textContent = items.length
    ? `第 ${idx + 1} / ${items.length} 张 · ${items[idx].boxes.length} 个框` +
      ` · 已改 ${items.filter(o => o.dirty).length} 张` +
      (dirHandle ? " · 自动保存开" : " · 只读模式（导出改动）")
    : "没有加载数据";
}

/* ---------------- 打开文件夹 ---------------- */
document.getElementById("open").onclick = async () => {
  if (window.showDirectoryPicker) {
    try {
      const dir = await window.showDirectoryPicker({ mode: "readwrite" });
      await loadFromDirectory(dir);
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return;
      toast("目录选择失败，改用文件选择：" + (e && e.message ? e.message : e), 4000);
    }
  }
  pickFilesFallback();
};

function pickFilesFallback() {
  const inp = document.createElement("input");
  inp.type = "file";
  inp.multiple = true;
  inp.webkitdirectory = true;
  inp.onchange = () => loadFromFiles([...inp.files]);
  inp.click();
}

async function loadFromDirectory(dir) {
  const imagesDir = await dir.getDirectoryHandle("images");
  const labelsDir = await dir.getDirectoryHandle("labels");
  // 先读类别表：批次数据的口径可能与工具内置的不同（例如 10 类含 rider）
  try {
    const cf = await (await dir.getFileHandle("classes.txt")).getFile();
    setClasses(parseClassesText(await cf.text()));
  } catch (e) { /* 没有就沿用内置类别表 */ }
  let order = null;
  try {
    const f = await (await dir.getFileHandle("review_order.txt")).getFile();
    order = (await f.text()).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  } catch (e) { /* 没有优先顺序就按文件名 */ }

  const entries = [];
  for await (const [name, h] of imagesDir.entries()) {
    if (h.kind === "file" && /\.(jpe?g|png|bmp)$/i.test(name)) entries.push([name, h]);
  }
  entries.sort((a, b) => a[0].localeCompare(b[0], "zh", { numeric: true }));
  const map = new Map(entries);
  const ordered = order ? order.filter(n => map.has(n)).map(n => [n, map.get(n)]) : entries;
  for (const [n, h] of entries) if (!ordered.some(e => e[0] === n)) ordered.push([n, h]);

  dirHandle = dir;
  items = ordered.map(([name]) => ({ name, handle: null, dir: imagesDir, labelsDir }));
  await Promise.all(items.map(async (it) => {
    it.handle = map.get(it.name);
    const f = await it.handle.getFile();
    it.url = URL.createObjectURL(f);
    it.file = f;
    const txt = await readLabel(labelsDir, it.name);
    it.boxes = parseLabel(txt);
    it.base = txt;
    it.dirty = false;
  }));
  await loadImage(0);
  toast(`已载入 ${items.length} 张图（来自 ${dir.name}）`);
}

async function loadFromFiles(files) {
  const clsFile = files.find(f => /(^|\/)classes\.txt$/i.test(f.webkitRelativePath || f.name));
  if (clsFile) setClasses(parseClassesText(await clsFile.text()));
  const imgFiles = files.filter(f => /\.(jpe?g|png|bmp)$/i.test(f.name) && /(^|\/)images\//i.test(f.webkitRelativePath || f.name));
  const lblFiles = files.filter(f => /\.txt$/i.test(f.name) && /(^|\/)labels\//i.test(f.webkitRelativePath || f.name));
  const lblMap = new Map(lblFiles.map(f => [f.name, f]));
  if (!imgFiles.length) { toast("没找到 images/ 里的图片，请选择包含 images 与 labels 的批次文件夹", 5000); return; }
  imgFiles.sort((a, b) => a.name.localeCompare(b.name, "zh", { numeric: true }));
  dirHandle = null;
  items = await Promise.all(imgFiles.map(async (f) => {
    const lf = lblMap.get(f.name.replace(/\.[^.]+$/, ".txt"));
    const txt = lf ? await lf.text() : "";
    return { name: f.name, file: f, url: URL.createObjectURL(f), boxes: parseLabel(txt),
             base: txt, dirty: false, handle: null, dir: null, labelsDir: null };
  }));
  await loadImage(0);
  toast(`已载入 ${items.length} 张图（只读模式，改完用"导出改动"）`);
}

async function readLabel(labelsDir, imgName) {
  const txtName = imgName.replace(/\.[^.]+$/, ".txt");
  try {
    const fh = await labelsDir.getFileHandle(txtName);
    return await (await fh.getFile()).text();
  } catch (e) { return ""; }
}

function parseLabel(txt) {
  const out = [];
  for (const line of (txt || "").split(/\r?\n/)) {
    const p = line.trim().split(/\s+/);
    if (p.length < 5) continue;
    const v = p.map(Number);
    if (v.some(n => !isFinite(n))) continue;
    out.push([Math.round(v[0]), v[1], v[2], v[3], v[4]]);
  }
  return out;
}

function labelText(it) {
  return it.boxes.map(b => [b[0], ...b.slice(1).map(v => v.toFixed(6))].join(" ")).join("\n") + (it.boxes.length ? "\n" : "");
}

function loadImage(i) {
  if (!items.length) return;
  idx = Math.max(0, Math.min(items.length - 1, i));
  sel = -1; drag = null; mode = null;
  const it = items[idx];
  const img = new Image();
  img.onload = () => {
    it.img = img; it.w = img.naturalWidth; it.h = img.naturalHeight;
    fit();
  };
  img.src = it.url;
  if (!undo[it.name]) undo[it.name] = [];
  refreshChips();
  draw();
}

/* ---------------- 坐标与绘制 ---------------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = stage.clientWidth * dpr;
  cv.height = stage.clientHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}
window.addEventListener("resize", resize);

function fit() {
  const it = items[idx];
  if (!it || !it.img) return;
  const cw = stage.clientWidth, ch = stage.clientHeight;
  scale = Math.min(cw / it.w, ch / it.h) * 0.98;
  ox = (cw - it.w * scale) / 2;
  oy = (ch - it.h * scale) / 2;
  draw();
}

const sx = (x) => x * scale + ox;
const sy = (y) => y * scale + oy;
const ix = (px) => (px - ox) / scale;
const iy = (py) => (py - oy) / scale;

function boxXYXY(b) {
  return [b[1] - b[3] / 2, b[2] - b[4] / 2, b[1] + b[3] / 2, b[2] + b[4] / 2];
}
function fromXYXY(c, r) {
  return [c, (r[0] + r[2]) / 2, (r[1] + r[3]) / 2, r[2] - r[0], r[3] - r[1]];
}

function draw() {
  const it = items[idx];
  ctx.clearRect(0, 0, cv.width, cv.height);
  if (!it || !it.img) { return; }
  ctx.drawImage(it.img, ox, oy, it.w * scale, it.h * scale);
  ctx.lineWidth = 2;
  ctx.font = "600 14px 'Microsoft YaHei',sans-serif";
  it.boxes.forEach((b, i) => {
    const [x1, y1, x2, y2] = boxXYXY(b);
    const X1 = sx(x1), Y1 = sy(y1), X2 = sx(x2), Y2 = sy(y2);
    const c = COLORS[b[0]] || "#fff";
    ctx.strokeStyle = c;
    ctx.strokeRect(X1, Y1, X2 - X1, Y2 - Y1);
    const label = CLASS_CN[b[0]] || CLASSES[b[0]] || b[0];
    const tw = ctx.measureText(label).width + 10;
    ctx.fillStyle = c;
    ctx.fillRect(X1, Math.max(0, Y1 - 20), tw, 19);
    ctx.fillStyle = "#111";
    ctx.fillText(label, X1 + 5, Math.max(14, Y1 - 6));
    if (i === sel) {
      ctx.fillStyle = "#fff";
      [[X1, Y1], [X2, Y1], [X1, Y2], [X2, Y2]].forEach(([hx, hy]) => {
        ctx.fillRect(hx - 5, hy - 5, 10, 10);
      });
    }
  });
  refreshChips();
}

/* ---------------- 鼠标 ---------------- */
function pos(ev) {
  const r = cv.getBoundingClientRect();
  return [ev.clientX - r.left, ev.clientY - r.top];
}
function hitBox(px, py) {
  const it = items[idx];
  for (let i = it.boxes.length - 1; i >= 0; i--) {
    const [x1, y1, x2, y2] = boxXYXY(it.boxes[i]);
    if (ix(px) >= x1 && ix(px) <= x2 && iy(py) >= y1 && iy(py) <= y2) return i;
  }
  return -1;
}
function hitCorner(px, py) {
  if (sel < 0) return -1;
  const [x1, y1, x2, y2] = boxXYXY(items[idx].boxes[sel]);
  const pts = [[sx(x1), sy(y1)], [sx(x2), sy(y1)], [sx(x1), sy(y2)], [sx(x2), sy(y2)]];
  for (let i = 0; i < 4; i++) {
    if (Math.abs(px - pts[i][0]) <= 8 && Math.abs(py - pts[i][1]) <= 8) return i;
  }
  return -1;
}

cv.addEventListener("mousedown", (ev) => {
  if (!items.length || !items[idx].img) return;
  const [px, py] = pos(ev);
  if (ev.button === 1 || spaceDown) {
    mode = "pan"; drag = { px, py, ox, oy };
    ev.preventDefault();
    return;
  }
  if (ev.button !== 0) return;
  const it = items[idx];
  pushUndo();
  const corner = hitCorner(px, py);
  if (corner >= 0) {
    mode = "resize";
    drag = { corner, start: boxXYXY(it.boxes[sel]).slice() };
    return;
  }
  const hit = hitBox(px, py);
  if (hit >= 0) {
    sel = hit;
    curCls = it.boxes[hit][0];
    mode = "move";
    drag = { grab: [ix(px), iy(py)], rect: boxXYXY(it.boxes[hit]).slice() };
    draw();
    return;
  }
  sel = it.boxes.length;
  it.boxes.push([curCls, ix(px), iy(py), 0, 0]);
  mode = "draw";
  drag = { start: [ix(px), iy(py)] };
  draw();
});

window.addEventListener("mousemove", (ev) => {
  if (!mode || !drag) return;
  const [px, py] = pos(ev);
  const it = items[idx];
  if (mode === "pan") {
    ox = drag.ox + (px - drag.px); oy = drag.oy + (py - drag.py);
  } else if (mode === "draw") {
    const [x0, y0] = drag.start;
    it.boxes[sel] = fromXYXY(curCls, [Math.min(x0, ix(px)), Math.min(y0, iy(py)),
                                      Math.max(x0, ix(px)), Math.max(y0, iy(py))]);
  } else if (mode === "move") {
    const dx = ix(px) - drag.grab[0], dy = iy(py) - drag.grab[1];
    it.boxes[sel] = fromXYXY(it.boxes[sel][0], [drag.rect[0] + dx, drag.rect[1] + dy,
                                                drag.rect[2] + dx, drag.rect[3] + dy]);
  } else if (mode === "resize") {
    const b = boxXYXY(it.boxes[sel]).slice();
    const cx = ix(px), cy = iy(py);
    const fixedX = (drag.corner === 0 || drag.corner === 2) ? b[2] : b[0];
    const fixedY = (drag.corner === 0 || drag.corner === 1) ? b[3] : b[1];
    it.boxes[sel] = fromXYXY(it.boxes[sel][0],
      [Math.min(fixedX, cx), Math.min(fixedY, cy), Math.max(fixedX, cx), Math.max(fixedY, cy)]);
  }
  draw();
});

window.addEventListener("mouseup", () => {
  if (!mode) return;
  const it = items[idx];
  if (mode === "draw" && it.boxes[sel] && (it.boxes[sel][3] < 4 || it.boxes[sel][4] < 4)) {
    it.boxes.splice(sel, 1);
    sel = -1;
  } else if (mode !== "pan") {
    markDirty();
  }
  mode = null; drag = null;
  draw();
});

cv.addEventListener("wheel", (ev) => {
  if (!items.length || !items[idx].img) return;
  ev.preventDefault();
  const [px, py] = pos(ev);
  const wx = ix(px), wy = iy(py);
  const factor = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
  scale = Math.max(0.05, Math.min(20, scale * factor));
  ox = px - wx * scale;
  oy = py - wy * scale;
  draw();
}, { passive: false });

/* ---------------- 键盘 ---------------- */
window.addEventListener("keydown", (ev) => {
  if (ev.code === "Space") { spaceDown = true; return; }
  if (!items.length) return;
  const it = items[idx];
  const k = ev.key;
  // 1~9 → 第 1~9 类；0 → 第 10 类（10 类口径需要）
  if (/^[1-9]$/.test(k) || k === "0") {
    const i = k === "0" ? 9 : Number(k) - 1;
    if (i < CLASSES.length) { setClass(i); ev.preventDefault(); }
    return;
  }
  if (k === "Delete" || k === "Backspace") {
    if (sel >= 0) { pushUndo(); it.boxes.splice(sel, 1); sel = -1; markDirty(); draw(); }
    ev.preventDefault(); return;
  }
  if (k === "d" || k === "D" || k === "ArrowRight") { go(1); ev.preventDefault(); return; }
  if (k === "a" || k === "A" || k === "ArrowLeft") { go(-1); ev.preventDefault(); return; }
  if (k === "f" || k === "F") { fit(); return; }
  if (k === "r" || k === "R") { applyRiderRule(); return; }
  if (k === "z" && (ev.ctrlKey || ev.metaKey)) { popUndo(); ev.preventDefault(); return; }
  if (k === "s" && (ev.ctrlKey || ev.metaKey)) { saveCurrent(true); ev.preventDefault(); }
});
window.addEventListener("keyup", (ev) => { if (ev.code === "Space") spaceDown = false; });

/* ---------------- 编辑动作 ---------------- */
function setClass(c) {
  curCls = c;
  const it = items[idx];
  if (it && sel >= 0 && it.boxes[sel]) {
    pushUndo();
    it.boxes[sel][0] = c;
    markDirty();
  }
  draw();
}
function pushUndo() {
  const it = items[idx];
  if (!it) return;
  (undo[it.name] = undo[it.name] || []).push(JSON.stringify(it.boxes));
  if (undo[it.name].length > 60) undo[it.name].shift();
}
function popUndo() {
  const it = items[idx];
  const st = it && undo[it.name];
  if (!st || !st.length) return;
  it.boxes = JSON.parse(st.pop());
  sel = -1; markDirty(); draw();
}
function markDirty() {
  const it = items[idx];
  if (!it) return;
  it.dirty = labelText(it) !== it.base;
}

/* 与 trafficvision/labelrules.suppress_riders 同一条规则：
   行人框中心在载具框内 + 被覆盖面积 ≥50% + 载具面积 ≥ 行人面积×0.8 → 删掉 */
function applyRiderRule() {
  const it = items[idx];
  const vehicles = it.boxes.filter(b => vehicleIds().includes(b[0]));
  if (!vehicles.length) { toast("这一张没有载具框，无需清理"); return; }
  pushUndo();
  const before = it.boxes.length;
  it.boxes = it.boxes.filter((b) => {
    if (b[0] !== personId()) return true;
    const [px1, py1, px2, py2] = boxXYXY(b);
    const pArea = Math.max(1e-9, (px2 - px1) * (py2 - py1));
    return !vehicles.some((v) => {
      const [vx1, vy1, vx2, vy2] = boxXYXY(v);
      const iw = Math.min(px2, vx2) - Math.max(px1, vx1);
      const ih = Math.min(py2, vy2) - Math.max(py1, vy1);
      if (iw <= 0 || ih <= 0) return false;
      const cover = (iw * ih) / pArea;
      const inside = vx1 <= b[1] && b[1] <= vx2 && vy1 <= b[2] && b[2] <= vy2;
      const vArea = (vx2 - vx1) * (vy2 - vy1);
      return inside && cover >= 0.5 && vArea >= pArea * 0.8;
    });
  });
  sel = -1;
  markDirty();
  draw();
  toast(`清掉 ${before - it.boxes.length} 个骑乘中的行人框`);
}

/* ---------------- 保存 / 导航 ---------------- */
async function saveCurrent(showMsg) {
  const it = items[idx];
  if (!it) return;
  markDirty();
  if (!it.dirty) { if (showMsg) toast("这一张没有改动"); return; }
  if (!dirHandle || !it.labelsDir) {
    if (showMsg) { downloadOne(it); toast("只读模式：已把这一张的标注下载到「下载」文件夹"); }
    else if (!saveCurrent.hinted) {
      saveCurrent.hinted = true;
      toast("只读模式：改动不会自动保存，干完点「导出全部改动」", 4000);
    }
    return;
  }
  const txtName = it.name.replace(/\.[^.]+$/, ".txt");
  const fh = await it.labelsDir.getFileHandle(txtName, { create: true });
  const w = await fh.createWritable();
  await w.write(labelText(it));
  await w.close();
  it.base = labelText(it);
  it.dirty = false;
  refreshChips();
  if (showMsg) toast("已保存 " + txtName);
}

function downloadOne(it) {
  const blob = new Blob([labelText(it)], { type: "text/plain" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = it.name.replace(/\.[^.]+$/, ".txt");
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function go(step) {
  await saveCurrent(false);
  await loadImage(idx + step);
}

document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.getElementById("fit").onclick = fit;
document.getElementById("rule").onclick = applyRiderRule;
document.getElementById("undo").onclick = popUndo;
document.getElementById("save").onclick = () => saveCurrent(true);
document.getElementById("export").onclick = () => window.exportDirty();
document.getElementById("helpBtn").onclick = () => {
  helpEl.style.display = helpEl.style.display === "block" ? "none" : "block";
};

/* 只读模式：批量导出改动过的标注 */
window.exportDirty = async () => {
  const dirty = items.filter(o => o.dirty);
  if (!dirty.length) { toast("没有改动需要导出"); return; }
  for (const it of dirty) downloadOne(it);
  toast(`已导出 ${dirty.length} 个改动过的标注文件（在「下载」文件夹）`, 4000);
};

window.addEventListener("beforeunload", (ev) => {
  if (items.some(o => o.dirty)) { ev.preventDefault(); ev.returnValue = ""; }
});

resize();
</script>
